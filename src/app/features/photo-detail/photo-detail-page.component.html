<section aria-labelledby="detail-heading">
  <h2 id="detail-heading" class="visually-hidden">Single photo</h2>

  <div class="app-page__header">
    <app-photo-meta [author]="photo.author" [downloadUrl]="photo.downloadUrl" />
    <app-route-chip [path]="routePath" />
  </div>

  <app-photo-stage [photo]="photo" animate.enter="app-enter-fade" />

  <app-button variant="danger" icon="heart_minus">Remove from favorites</app-button>
</section>
