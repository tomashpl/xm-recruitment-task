<section aria-labelledby="detail-heading">
  <h2 id="detail-heading" class="visually-hidden">Single photo</h2>

  <div class="app-page__header">
    <ui-icon-button icon="arrow_back" label="Go back" size="sm" (activate)="goBack()" />
    <app-photo-meta [author]="photo().author" />
  </div>

  <app-photo-stage [photo]="photo()" animate.enter="app-enter-fade" />

  <ui-button variant="danger" icon="heart_minus">Remove from favorites</ui-button>
</section>
