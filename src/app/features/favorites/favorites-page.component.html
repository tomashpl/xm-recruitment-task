<section aria-labelledby="favorites-heading">
  <div class="app-page__header">
    <app-section-heading
      headingId="favorites-heading"
      heading="Favorites"
      hint="tap a photo to open it"
    />
    <app-route-chip path="/favorites" />
  </div>

  @if (favorites().length === 0) {
    <app-empty-state
      icon="favorite_border"
      message="No favorites yet. Photos you tap in the photostream show up here."
    >
      <a routerLink="/" class="app-favorites__cta">Browse photos</a>
    </app-empty-state>
  } @else {
    <app-photo-grid>
      @for (photo of favorites(); track photo.id) {
        <li animate.enter="app-enter-fade">
          <app-photo-tile [photo]="photo" [favorite]="true" interaction="link" />
        </li>
      }
    </app-photo-grid>
  }
</section>
