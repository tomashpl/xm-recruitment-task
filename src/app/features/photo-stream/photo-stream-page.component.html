<section aria-labelledby="stream-heading">
  <div class="app-page__header">
    <ui-section-heading
      headingId="stream-heading"
      heading="Random photostream"
      hint="tap a photo to save it to favorites"
    />
    <app-grid-layout-toggle [layout]="layout()" (layoutChange)="onLayoutChange($event)" />
  </div>

  @if (photos.isLoading()) {
    <div class="app-page__loader">
      <ui-loading-indicator animate.enter="app-enter-slide" />
    </div>
  } @else if (photos.error()) {
    <ui-empty-state
      icon="cloud_off"
      message="Could not load photos. Check your connection and try again."
    >
      <ui-button icon="refresh" (activate)="photos.reload()">Try again</ui-button>
    </ui-empty-state>
  } @else {
    <app-photo-grid #grid [layout]="layout()">
      @for (photo of photos.value(); track photo.id) {
        <li animate.enter="app-enter-fade" [style.grid-row-end]="grid.spanFor(photo)">
          <app-photo-tile
            [photo]="photo"
            [aspectRatio]="grid.ratioFor(photo)"
            (activate)="onActivate($event)"
          />
        </li>
      }
    </app-photo-grid>
  }
</section>
