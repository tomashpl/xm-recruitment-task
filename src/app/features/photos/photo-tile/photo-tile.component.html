@if (isLink()) {
  <a [routerLink]="detailLink()" [attr.aria-label]="label()">
    <app-photo-thumb [photo]="photo()" [overlay]="favorite()" />
    <app-favorite-badge [active]="favorite()" />
  </a>
} @else {
  <button
    type="button"
    [attr.aria-label]="label()"
    [attr.aria-pressed]="favorite()"
    (click)="activate.emit(photo())"
  >
    <app-photo-thumb [photo]="photo()" [overlay]="favorite()" />
    <app-favorite-badge [active]="favorite()" />
  </button>
}
