@if (isLink()) {
  <a [routerLink]="detailLink()" [attr.aria-label]="label()" [style.aspect-ratio]="aspectRatio()">
    <app-photo-thumb [photo]="photo()" [overlay]="favorite()" />
    <app-favorite-badge [active]="favorite()" />
  </a>
} @else {
  <button
    type="button"
    [attr.aria-label]="label()"
    [attr.aria-pressed]="favorite()"
    (click)="activate.emit(photo())"
    (mouseenter)="setEngaged(true)"
    (mouseleave)="setEngaged(false)"
    (focus)="setEngaged(true)"
    (blur)="setEngaged(false)"
    [style.aspect-ratio]="aspectRatio()"
  >
    <app-photo-thumb [photo]="photo()" [overlay]="favorite()" />
    <app-favorite-badge [active]="favorite()" [expanded]="engaged()" />
  </button>
}
